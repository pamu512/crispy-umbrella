# Windows one-file EXE: bundles social_media + shared_utils (vault ingestor).

name: Build Windows EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name CTI_Pipeline_Win --add-data "social_media;social_media" --add-data "src-tauri/resources/scripts/shared_utils;shared_utils" main_pipeline.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/CTI_Pipeline_Win.exe
