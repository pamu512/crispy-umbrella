# Tauri: Next static export + Rust → macOS .dmg (unsigned; suitable for CI artifacts).

name: Build macOS DMG

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install a current toolchain (images may still default to an old cargo on PATH).
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prefer rustup shims (avoid stale system cargo)
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v rustc
          command -v cargo
          rustc --version
          cargo --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `bundle.externalBin` entries must exist before `cargo build` / tauri-build (see `npm run build:python`).
      - name: Install PyInstaller and ingestion requirements (sidecar freeze)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          pip install pyinstaller
          pip install \
            -r src-tauri/resources/scripts/Compromised_user_Mac/requirements.txt \
            -r src-tauri/resources/scripts/Ransomware_live_event_victim/requirements.txt \
            -r src-tauri/resources/scripts/CVE_Project_NVD/requirements.txt \
            -r src-tauri/resources/scripts/IOCs-crawler-main/requirements.txt \
            -r src-tauri/resources/scripts/Intelx_Crawler/requirements.txt

      - name: Freeze Python ingestion tools (host triple → src-tauri/binaries/)
        run: npm run build:python

      - name: Verify Tauri bundle inputs
        run: |
          set -euo pipefail
          test -f src-tauri/tauri.conf.json
          test -f src-tauri/Cargo.toml
          test -f src-tauri/icons/icon.icns
          ls -la src-tauri/binaries/
          test "$(find src-tauri/binaries -maxdepth 1 -type f -name 'intelx-scraper-*-apple-darwin' | wc -l | tr -d ' ')" != "0"

      - name: Build Tauri (generates .dmg)
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ( cd src-tauri && rustc --version && cargo --version )
          npm run tauri build -- --verbose

      - name: List bundle output
        if: always()
        run: find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.app' \) 2>/dev/null | head -20 || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
