name: Run Brand Scout

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain name to process'
        required: true
      keyword:
        description: 'Keyword for social media scan'
        required: true
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true

jobs:
  process_domain:
    runs-on: ubuntu-latest
    steps:
      - name: Run Brand Scout
        run: |
          docker run --privileged --rm -v $(pwd):/workdir br0k3nm1rr0r/brand-scout -all "${{ github.event.inputs.domain }}" "${{ github.event.inputs.keyword }}" "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}"

      - name: Collect Artifacts
        shell: bash
        run: |
          mkdir -p brand_scout_artifacts
          for item in *; do
            if [ "$item" != "brand_scout_artifacts" ] && [ -e "$item" ]; then
              mv "$item" brand_scout_artifacts/
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "brand-scout-${{ github.event.inputs.domain }}"
          path: brand_scout_artifacts/