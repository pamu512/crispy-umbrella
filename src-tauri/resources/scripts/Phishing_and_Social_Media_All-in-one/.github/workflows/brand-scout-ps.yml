name: Run Brand Scout - Phishing Scan

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain name to process (comma-separated for multiple)'
        required: true
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true

jobs:
  process_domain_ps:
    runs-on: ubuntu-latest
    steps:
      - name: Run Brand Scout - PS
        run: |
          docker run --privileged --rm -v $(pwd):/workdir br0k3nm1rr0r/brand-scout -ps "${{ github.event.inputs.domain }}" "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}"

      - name: Collect Artifacts
        shell: bash
        run: |
          mkdir -p brand_scout_artifacts
          for item in *; do
            if [ "$item" != "brand_scout_artifacts" ] && [ -e "$item" ]; then
              mv "$item" brand_scout_artifacts/
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "brand-scout-ps-results"
          path: brand_scout_artifacts/
