[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
csv = "1.3"
walkdir = "2.5"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.52.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1.11", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
futures-util = "0.3"
scraper = "0.22"
feed-rs = "2.3"
regex = "1.11"
dirs = "5.0"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
trust-dns-resolver = { version = "0.23.2", default-features = false, features = ["tokio-runtime", "system-config"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
x509-parser = "0.16"
hex = "0.4"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
r2d2 = "0.8"
tauri-plugin-shell = "2"
